<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Café Leaderboard</title>
    <style>
        /* Theme Colors: Espresso (#3E2723), Caramel (#F5C77E), Milk Tea (#E0D5C1), Thai Tea (#FFCCBC), Cream (#FDFBF7) */
        @import url('https://fonts.googleapis.com/css2?family=Tahoma&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tahoma', sans-serif;
        }

        body {
            background-color: #FDFBF7;
            color: #3E2723;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: #FFFFFF;
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 10px 25px rgba(62, 39, 35, 0.08);
            border: 1px solid #E0D5C1;
        }

        /* Header Banner */
        .header-banner {
            background-color: #3E2723;
            color: #FFFFFF;
            text-align: center;
            padding: 18px 20px;
            border-radius: 16px;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin-bottom: 25px;
            box-shadow: 0 4px 12px rgba(62, 39, 35, 0.15);
        }

        /* Podium Cards Section */
        .podium-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .card {
            border-radius: 18px;
            padding: 20px 15px;
            text-align: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.06);
        }

        .card-badge {
            font-size: 13px;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.6);
        }

        .card-name {
            font-size: 16px;
            font-weight: bold;
            color: #3E2723;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-score {
            font-size: 26px;
            font-weight: bold;
            color: #3E2723;
        }

        /* Card Themes */
        .card-rank-1 {
            background-color: #F5C77E; /* Caramel */
            border: 2px solid #E6B055;
            grid-column: span 3;
        }
        @media (min-width: 600px) {
            .card-rank-1 { grid-column: span 3; }
            .card-rank-2, .card-rank-3 { grid-column: span 1.5; }
        }

        .card-rank-2 {
            background-color: #E0D5C1; /* Milk Tea */
            border: 1px solid #C8BC9E;
        }

        .card-rank-3 {
            background-color: #FFCCBC; /* Thai Tea */
            border: 1px solid #E6B2A2;
        }

        /* Table Section */
        .table-container {
            overflow-x: auto;
            border-radius: 14px;
            border: 1px solid #E0D5C1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            background-color: #FFFFFF;
        }

        th {
            background-color: #3E2723;
            color: #FFFFFF;
            padding: 14px 18px;
            font-size: 14px;
            font-weight: bold;
        }

        td {
            padding: 12px 18px;
            border-bottom: 1px solid #F0EAE1;
            font-size: 14px;
            color: #3E2723;
        }

        tr:nth-child(even) {
            background-color: #FAF7F2;
        }

        tr:hover {
            background-color: #F5EFE6;
        }

        .rank-col {
            width: 80px;
            text-align: center;
            font-weight: bold;
        }

        .score-col {
            width: 120px;
            text-align: right;
            font-weight: bold;
            color: #D35400;
        }

        /* Footer & Reload Button */
        .footer-tools {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            font-size: 12px;
            color: #8D6E63;
        }

        .btn-refresh {
            background-color: #3E2723;
            color: #FFFFFF;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-refresh:hover {
            background-color: #5D4037;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 16px;
            color: #8D6E63;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header Banner -->
    <div class="header-banner">
        ☕ Cafe De Memories - Daily Quiz Leaderboard
    </div>

    <!-- Top 3 Cards -->
    <div class="podium-container" id="podium">
        <div class="loading">กำลังโหลดข้อมูลอันดับ...</div>
    </div>

    <!-- Main Table -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th class="rank-col">อันดับ</th>
                    <th>ชื่อผู้เล่น</th>
                    <th class="score-col">คะแนน</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr>
                    <td colspan="3" class="loading">กำลังดึงข้อมูลจาก Google Sheets...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Footer Tools -->
    <div class="footer-tools">
        <span id="last-updated">อัปเดตล่าสุด: -</span>
        <button class="btn-refresh" onclick="fetchLeaderboardData()">🔄 รีเฟรชข้อมูล</button>
    </div>
</div>

<script>
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT_pS4D-eC3tkNhuCrTBYHB1czXd8bHERQDRuXCXPSYiAYL3u_julukAn8YwyvAichaaaEToi_f6oTM/pub?gid=279449078&single=true&output=csv';

    function fetchLeaderboardData() {
        document.getElementById('last-updated').innerText = 'กำลังอัปเดต...';
        
        // Add timestamp to prevent browser cache
        fetch(csvUrl + '&t=' + new Date().getTime())
            .then(response => response.text())
            .then(csvText => {
                const rows = parseCSV(csvText);
                if (rows.length <= 1) {
                    showError('ไม่พบข้อมูลในระบบ');
                    return;
                }

                // Header mapping assuming row 0 is Header
                // Auto-detect columns or default: Rank (col 0), Name (col 1), Score (col 2)
                const data = rows.slice(1).filter(r => r.length >= 2 && r[0] !== '');

                renderPodium(data);
                renderTable(data);

                const now = new Date();
                document.getElementById('last-updated').innerText = 'อัปเดตล่าสุด: ' + now.toLocaleTimeString('th-TH');
            })
            .catch(err => {
                console.error(err);
                showError('ไม่สามารถดึงข้อมูลได้ โปรดตรวจสอบการเชื่อมต่อ');
            });
    }

    function parseCSV(text) {
        const lines = text.split(/
|
/);
        return lines.map(line => {
            // Basic CSV Splitter handling simple quotes
            return line.split(',').map(cell => cell.replace(/^"(.*)"$/, '$1').trim());
        });
    }

    function renderPodium(data) {
        const podiumContainer = document.getElementById('podium');
        if (data.length === 0) {
            podiumContainer.innerHTML = '';
            return;
        }

        let html = '';

        // Rank 1
        if (data[0]) {
            html += `
                <div class="card card-rank-1">
                    <div class="card-badge">🏆 CHAMPION</div>
                    <div class="card-name">${data[0][1] || data[0][0]}</div>
                    <div class="card-score">${data[0][2] || data[0][1] || 0} คะแนน</div>
                </div>
            `;
        }

        // Rank 2
        if (data[1]) {
            html += `
                <div class="card card-rank-2">
                    <div class="card-badge">🥈 อันดับ 2</div>
                    <div class="card-name">${data[1][1] || data[1][0]}</div>
                    <div class="card-score">${data[1][2] || data[1][1] || 0} คะแนน</div>
                </div>
            `;
        }

        // Rank 3
        if (data[2]) {
            html += `
                <div class="card card-rank-3">
                    <div class="card-badge">🥉 อันดับ 3</div>
                    <div class="card-name">${data[2][1] || data[2][0]}</div>
                    <div class="card-score">${data[2][2] || data[2][1] || 0} คะแนน</div>
                </div>
            `;
        }

        podiumContainer.innerHTML = html;
    }

    function renderTable(data) {
        const tableBody = document.getElementById('table-body');
        if (data.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="3" style="text-align:center;">ไม่มีข้อมูลอันดับ</td></tr>';
            return;
        }

        let html = '';
        data.forEach((row, index) => {
            const rank = row[0] || (index + 1);
            const name = row[1] || '-';
            const score = row[2] || row[1] || '0';

            html += `
                <tr>
                    <td class="rank-col">${rank}</td>
                    <td>${name}</td>
                    <td class="score-col">${score}</td>
                </tr>
            `;
        });

        tableBody.innerHTML = html;
    }

    function showError(msg) {
        document.getElementById('podium').innerHTML = '';
        document.getElementById('table-body').innerHTML = `<tr><td colspan="3" style="text-align:center; color:red;">${msg}</td></tr>`;
    }

    // Auto load on start
    window.onload = fetchLeaderboardData;
</script>

</body>
</html>
