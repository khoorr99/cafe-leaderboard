<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Café Leaderboard</title>
    <style>
        /* Theme Colors: 
           Espresso: #3E2723
           Caramel:  #F5C77E
           Milk Tea: #E0D5C1
           Thai Tea: #FFCCBC
           Cream:    #FDFBF7
        */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tahoma', sans-serif;
        }

        body {
            background-color: #FDFBF7;
            color: #3E2723;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: #FFFFFF;
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 10px 25px rgba(62, 39, 35, 0.08);
            border: 1px solid #E0D5C1;
        }

        /* Header Banner */
        .header-banner {
            background-color: #3E2723;
            color: #FFFFFF;
            text-align: center;
            padding: 18px 20px;
            border-radius: 16px;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin-bottom: 25px;
            box-shadow: 0 4px 12px rgba(62, 39, 35, 0.15);
        }

        /* Podium Cards Section */
        .podium-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .card {
            border-radius: 18px;
            padding: 20px 15px;
            text-align: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.06);
        }

        .card-badge {
            font-size: 13px;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.7);
            color: #3E2723;
        }

        .card-name {
            font-size: 16px;
            font-weight: bold;
            color: #3E2723;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-score {
            font-size: 26px;
            font-weight: bold;
            color: #3E2723;
        }

        /* Card Themes */
        .card-rank-1 {
            background-color: #F5C77E; /* Caramel */
            border: 2px solid #E6B055;
            grid-column: span 3;
        }

        @media (min-width: 600px) {
            .card-rank-1 { grid-column: span 3; }
            .card-rank-2, .card-rank-3 { grid-column: span 1.5; }
        }

        .card-rank-2 {
            background-color: #E0D5C1; /* Milk Tea */
            border: 1px solid #C8BC9E;
        }

        .card-rank-3 {
            background-color: #FFCCBC; /* Thai Tea */
            border: 1px solid #E6B2A2;
        }

        /* Table Section */
        .table-container {
            overflow-x: auto;
            border-radius: 14px;
            border: 1px solid #E0D5C1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            background-color: #FFFFFF;
        }

        th {
            background-color: #3E2723;
            color: #FFFFFF;
            padding: 14px 18px;
            font-size: 14px;
            font-weight: bold;
        }

        td {
            padding: 12px 18px;
            border-bottom: 1px solid #F0EAE1;
            font-size: 14px;
            color: #3E2723;
        }

        tr:nth-child(even) {
            background-color: #FAF7F2;
        }

        tr:hover {
            background-color: #F5EFE6;
        }

        .rank-col {
            width: 80px;
            text-align: center;
            font-weight: bold;
        }

        .score-col {
            width: 120px;
            text-align: right;
            font-weight: bold;
            color: #D35400;
        }

        /* Footer & Reload Button */
        .footer-tools {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            font-size: 12px;
            color: #8D6E63;
        }

        .btn-refresh {
            background-color: #3E2723;
            color: #FFFFFF;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-refresh:hover {
            background-color: #5D4037;
        }

        .loading-text {
            text-align: center;
            padding: 30px;
            font-size: 15px;
            color: #8D6E63;
            grid-column: span 3;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header Banner -->
    <div class="header-banner">
        ☕ Cafe De Memories - Daily Quiz Leaderboard
    </div>

    <!-- Top 3 Cards -->
    <div class="podium-container" id="podium">
        <div class="loading-text">⏳ กำลังโหลดข้อมูลอันดับ...</div>
    </div>

    <!-- Main Table -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th class="rank-col">อันดับ</th>
                    <th>ชื่อผู้เล่น</th>
                    <th class="score-col">คะแนน</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr>
                    <td colspan="3" class="loading-text">⏳ กำลังดึงข้อมูลจาก Google Sheets...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Footer Tools -->
    <div class="footer-tools">
        <span id="last-updated">อัปเดตล่าสุด: -</span>
        <button class="btn-refresh" onclick="fetchLeaderboardData()">🔄 รีเฟรชข้อมูล</button>
    </div>
</div>

<script>
    // URL Google Sheets CSV ที่แก้ไขถูกต้องแล้ว
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT_pS4D-eC3tkNhuCrTBYHczXd8bHERQDRuXCXPSYiAYL3u_julukAn8YwyvAichaaaEToi_f6oTM/pub?gid=279449078&single=true&output=csv';

    function fetchLeaderboardData() {
        document.getElementById('last-updated').innerText = 'กำลังอัปเดต...';

        fetch(csvUrl + '&t=' + new Date().getTime())
            .then(response => {
                if (!response.ok) {
                    throw new Error('ไม่สามารถเข้าถึงไฟล์ CSV ได้');
                }
                return response.text();
            })
            .then(csvText => {
                const rows = parseCSV(csvText);
                const validRows = rows.filter(r => r.length >= 2 && r.some(cell => cell.trim() !== ''));

                if (validRows.length <= 1) {
                    showError('ไม่พบข้อมูลอันดับในระบบ');
                    return;
                }

                const data = validRows.slice(1);

                renderPodium(data);
                renderTable(data);

                const now = new Date();
                document.getElementById('last-updated').innerText = 'อัปเดตล่าสุด: ' + now.toLocaleTimeString('th-TH');
            })
            .catch(err => {
                console.error('Fetch error:', err);
                showError('เกิดข้อผิดพลาดในการโหลดข้อมูล โปรดตรวจสอบการตั้งค่า Publish ใน Google Sheets');
            });
    }

    function parseCSV(text) {
        const lines = text.split(/\r?\n/);
        return lines.map(line => {
            const result = [];
            let current = '';
            let inQuotes = false;

            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim().replace(/^"(.*)"$/, '$1'));
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim().replace(/^"(.*)"$/, '$1'));
            return result;
        });
    }

    function renderPodium(data) {
        const podiumContainer = document.getElementById('podium');
        if (!data || data.length === 0) {
            podiumContainer.innerHTML = '';
            return;
        }

        let html = '';

        const getItem = (row) => {
            if (!row) return { rank: '', name: '-', score: '0' };
            if (row.length === 2) {
                return { rank: '1', name: row[0], score: row[1] };
            }
            return { rank: row[0] || '', name: row[1] || '-', score: row[2] || row[1] || '0' };
        };

        if (data[0]) {
            const p1 = getItem(data[0]);
            html += `
                <div class="card card-rank-1">
                    <div class="card-badge">🏆 CHAMPION</div>
                    <div class="card-name">${p1.name}</div>
                    <div class="card-score">${p1.score} คะแนน</div>
                </div>
            `;
        }

        if (data[1]) {
            const p2 = getItem(data[1]);
            html += `
                <div class="card card-rank-2">
                    <div class="card-badge">🥈 อันดับ 2</div>
                    <div class="card-name">${p2.name}</div>
                    <div class="card-score">${p2.score} คะแนน</div>
                </div>
            `;
        }

        if (data[2]) {
            const p3 = getItem(data[2]);
            html += `
                <div class="card card-rank-3">
                    <div class="card-badge">🥉 อันดับ 3</div>
                    <div class="card-name">${p3.name}</div>
                    <div class="card-score">${p3.score} คะแนน</div>
                </div>
            `;
        }

        podiumContainer.innerHTML = html;
    }

    function renderTable(data) {
        const tableBody = document.getElementById('table-body');
        if (!data || data.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="3" style="text-align:center;">ไม่มีข้อมูลอันดับ</td></tr>';
            return;
        }

        let html = '';
        data.forEach((row, index) => {
            let rank, name, score;
            if (row.length === 2) {
                rank = index + 1;
                name = row[0] || '-';
                score = row[1] || '0';
            } else {
                rank = row[0] || (index + 1);
                name = row[1] || '-';
                score = row[2] || row[1] || '0';
            }

            html += `
                <tr>
                    <td class="rank-col">${rank}</td>
                    <td>${name}</td>
                    <td class="score-col">${score}</td>
                </tr>
            `;
        });

        tableBody.innerHTML = html;
    }

    function showError(msg) {
        document.getElementById('podium').innerHTML = '';
        document.getElementById('table-body').innerHTML = `<tr><td colspan="3" style="text-align:center; color:#D35400; padding:25px;">⚠️ ${msg}</td></tr>`;
    }

    window.onload = fetchLeaderboardData;
</script>

</body>
</html>
